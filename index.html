<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="我的小工具">
<meta name="theme-color" content="#E9EDF0">
<title>我的小工具</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EDF0; --surface:#FFFFFF; --ink:#1C2733; --muted:#5E6B78; --line:#CDD5DC;
  --lcd:#D4DECF; --lcd-ink:#1A2E1F; --lcd-dim:#4F6553; --signal:#F2B705; --signal-ink:#1C2733;
  --warn:#B3261E;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151B21; --surface:#1F2730; --ink:#E6EBEF; --muted:#97A3AE; --line:#33404C;
    --lcd:#22301F; --lcd-ink:#C9F0B8; --lcd-dim:#86A57B; --signal:#F2B705; --signal-ink:#151B21;
    --warn:#FF8A80; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151B21; --surface:#1F2730; --ink:#E6EBEF; --muted:#97A3AE; --line:#33404C;
  --lcd:#22301F; --lcd-ink:#C9F0B8; --lcd-dim:#86A57B; --signal:#F2B705; --signal-ink:#151B21;
  --warn:#FF8A80; color-scheme: dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.num{font-family:"Barlow Semi Condensed","Roboto Condensed","Arial Narrow",sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:480px;margin:0 auto;padding:16px 16px 32px}
header{display:flex;align-items:baseline;justify-content:space-between;margin:4px 2px 14px}
h1{font-size:22px;margin:0;font-weight:700;letter-spacing:.02em}
.std{font-size:12px;color:var(--muted)}

.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:14px}
.tabs button{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:500;padding:10px 0;border-radius:9px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}

/* readout */
.lcd{background:var(--lcd);color:var(--lcd-ink);border-radius:14px;padding:14px 18px 16px;border:2px solid color-mix(in srgb,var(--lcd-ink) 18%,transparent);box-shadow:inset 0 2px 6px rgba(0,0,0,.08)}
.lcd-top{display:flex;justify-content:space-between;font-size:13px;color:var(--lcd-dim)}
.lcd-main{display:flex;align-items:baseline;justify-content:flex-end;gap:8px;margin-top:2px;min-height:76px}
.lcd-val{font-size:64px;font-weight:600;line-height:1.1;letter-spacing:.01em;overflow-wrap:anywhere;text-align:right}
.lcd-unit{font-size:26px;font-weight:600}
.lcd-sub{display:flex;justify-content:space-between;font-size:15px;color:var(--lcd-dim);border-top:1px dashed color-mix(in srgb,var(--lcd-ink) 25%,transparent);padding-top:8px;margin-top:6px}
.lcd.err .lcd-val{font-size:28px;color:var(--warn)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:14px}
.label{font-size:14px;color:var(--muted);margin:0 0 8px}
.dir{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.dir button{flex:1;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-weight:700;padding:11px 8px;border-radius:10px;cursor:pointer}
.dir button[aria-pressed="true"]{background:var(--signal);color:var(--signal-ink);border-color:var(--signal)}
.swap{flex:0 0 auto !important;width:44px;font-size:18px !important}

.entry{display:grid;grid-template-columns:56px 1fr 56px;gap:8px;align-items:stretch}
.entry button{border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:28px;line-height:1;border-radius:10px;cursor:pointer;touch-action:manipulation}
.entry button:active{background:var(--signal);color:var(--signal-ink)}
.field{position:relative}
.field input{width:100%;height:64px;border:2px solid var(--ink);border-radius:10px;background:var(--surface);color:var(--ink);font-size:32px;font-weight:600;text-align:center;padding:0 40px 0 10px}
.field input:focus{outline:3px solid var(--signal);outline-offset:1px}
.field span{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:18px;pointer-events:none}
.hint{font-size:13px;color:var(--muted);margin:8px 2px 0}

.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{flex:1;min-width:64px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-weight:500;padding:9px 6px;border-radius:999px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.row + .row{margin-top:12px}
.wire{display:flex;align-items:center;gap:8px}
.wire input{width:96px;height:42px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:18px;text-align:center}
.tol{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tol div{background:var(--bg);border-radius:10px;padding:8px 12px}
.tol small{display:block;font-size:12px;color:var(--muted)}
.tol b{font-size:24px;font-weight:600}

/* table */
.find{display:flex;gap:8px;align-items:center}
.find input{flex:1;height:48px;border:2px solid var(--ink);border-radius:10px;background:var(--surface);color:var(--ink);font-size:22px;text-align:center}
.find select{height:48px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;padding:0 8px}
.tbl{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tbl-head,.tr{display:grid;grid-template-columns:1fr 1.2fr 1.2fr 1fr;text-align:right;padding:0 14px}
.tbl-head{background:var(--ink);color:var(--bg);font-size:13px;padding-top:9px;padding-bottom:9px;position:sticky;top:env(safe-area-inset-top,0px);z-index:2}
.tbl-body{position:relative;max-height:60vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.tr{font-size:18px;padding-top:7px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.tr.ten{background:color-mix(in srgb,var(--signal) 10%,transparent)}
.tr.hit{background:var(--signal);color:var(--signal-ink);font-weight:700}
.tr span:first-child{font-weight:600}
.tr span:last-child,.tbl-head span:last-child{color:var(--muted)}
.tr.hit span:last-child{color:inherit}

footer{font-size:12px;color:var(--muted);margin-top:18px;line-height:1.7}
.cj{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.cj input{width:90px;height:44px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:20px;text-align:center}
.cj button{border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;padding:8px 12px;border-radius:999px;cursor:pointer}
.cj button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.wires{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px 12px;font-size:14px;margin-top:4px}
.wires b{font-weight:500}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px;border:1px solid var(--line)}
.tool{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:12px;color:var(--ink);text-decoration:none}
.tool:active{border-color:var(--signal)}
.ico{flex:0 0 52px;height:52px;border-radius:12px;background:var(--lcd);color:var(--lcd-ink);display:grid;place-items:center;font-size:26px}
.tool b{display:block;font-size:18px}
.tool small{color:var(--muted);font-size:14px}
.go{margin-left:auto;color:var(--muted);font-size:22px}
[hidden]{display:none !important}
@media (prefers-reduced-motion:no-preference){.lcd-val{transition:color .2s}}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>我的小工具</h1><span class="std">手機隨手算</span></header>
  <a class="tool" href="pt100/"><span class="ico">🌡️</span><span><b>PT100 換算</b><small>電阻 ⇄ 溫度・Pt100/500/1000</small></span><span class="go">›</span></a>
  <a class="tool" href="k-type/"><span class="ico">🔥</span><span><b>K 型熱電偶換算</b><small>mV ⇄ 溫度・含冷接點補償</small></span><span class="go">›</span></a>
  <a class="tool" href="running/"><span class="ico">🏃</span><span><b>跑步小幫手</b><small>心率・跑力配速・課表・紀錄</small></span><span class="go">›</span></a>
  <footer>加到手機主畫面：iPhone 用 Safari「分享 → 加入主畫面」；Android 用 Chrome「⋮ → 加到主畫面」。<br>換算依國際標準曲線計算，個別感測器請以校正報告為準。</footer>
</div>
</body>
</html>
